[package]
name = "frame-record"
version = "0.1.0"
edition = "2021"
description = "A small transparent screen recording frame for Windows, powered by FFmpeg"
license = "MIT"

[dependencies]
eframe = { version = "=0.34.3", default-features = false, features = ["default_fonts", "glow"] }
raw-window-handle = "0.6"
rfd = { version = "0.17.2", default-features = false }
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[workspace]
resolver = "2"

[build-dependencies]
winresource = { version = "0.1.34", default-features = false }
zip = { version = "9.0.5", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
